<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Diamond Manufacturing ERP">
  <!-- Solid tile: keeps the mark legible on both light and dark browser tab bars.
       #2563EB is the same corporate blue as the sign-in screen's primary action. -->
  <rect width="32" height="32" rx="7" fill="#2563EB"/>
  <!-- Brilliant-cut diamond, front elevation: table, crown, girdle, pavilion.
       Sized to leave only ~4px of tile padding and stroked thinly, so at 16px the
       facets blur into a solid gem that still reads instead of fragmenting. -->
  <path d="M11 9h10l7 6-12 11L4 15z" fill="#fff"/>
  <g stroke="#2563EB" stroke-width=".9" stroke-linejoin="round" fill="none">
    <path d="M4 15h24"/>
    <path d="M11 9v6M21 9v6"/>
    <path d="M11 15l5 11M21 15l-5 11"/>
  </g>
</svg>
