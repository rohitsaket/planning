<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Diamond Table & Upper Facet Gradients -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="facetTopRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="facetCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="facetCenterRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="facetCenterMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="facetPavilionLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="facetPavilionRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Outer Glow / Glow Filter -->
    <filter id="gemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Cyan Rim Light -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#tableGrad)" stroke-width="0.8" opacity="0.3"/>

  <!-- Diamond Facets Group with Glow -->
  <g filter="url(#gemGlow)">
    <!-- Top Crown Left Triangle -->
    <polygon points="12,22 22,12 25,22" fill="url(#facetTopLeft)" stroke="#E0F2FE" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Top Crown Center Table -->
    <polygon points="22,12 42,12 39,22 25,22" fill="url(#tableGrad)" stroke="#FFFFFF" stroke-width="0.75" stroke-linejoin="round"/>

    <!-- Top Crown Right Triangle -->
    <polygon points="42,12 52,22 39,22" fill="url(#facetTopRight)" stroke="#E0F2FE" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Crown Middle Left Star Facet -->
    <polygon points="12,22 25,22 32,22 18,22" fill="url(#facetCenterLeft)" stroke="#BAE6FD" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Pavilion Center Center Shield -->
    <polygon points="25,22 39,22 32,53" fill="url(#facetCenterMid)" stroke="#E0F2FE" stroke-width="0.6" stroke-linejoin="round"/>

    <!-- Pavilion Left Lower Facet -->
    <polygon points="12,22 25,22 32,53" fill="url(#facetPavilionLeft)" stroke="#7DD3FC" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Pavilion Right Lower Facet -->
    <polygon points="52,22 39,22 32,53" fill="url(#facetPavilionRight)" stroke="#A5B4FC" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- Brilliant Highlight Sparkles -->
    <!-- Top Left Sparkle -->
    <circle cx="22" cy="12" r="1.2" fill="#FFFFFF"/>
    <!-- Top Right Sparkle -->
    <circle cx="42" cy="12" r="1.2" fill="#FFFFFF"/>
    <!-- Culet (Bottom point) Sparkle -->
    <circle cx="32" cy="53" r="1" fill="#BAE6FD"/>

    <!-- Main Table Sparkle Cross -->
    <path d="M 28 17 L 30 17 M 29 16 L 29 18" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="29" cy="17" r="0.6" fill="#FFFFFF"/>
  </g>
</svg>
